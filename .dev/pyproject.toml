[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project]
authors = [
    {name = "Cujoko", email = "cujoko@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "appdirs>=1.4.4",
    "loguru>=0.6.0",
    "pyyaml>=6.0",
    "yodl>=1.0.0",
]
description = "Commons"
dynamic = ["version"]
keywords = ["commons"]
license = {text = "MIT"}
name = "cjk-commons"
requires-python = ">=3.10"

[project.urls]
repository = "https://github.com/cujoko-dev/commons"

[tool.pdm.build]
package-dir = "../src"

[tool.pdm.scripts]
test = { cmd = "pytest", working_dir = ".." }

[tool.pdm.version]
path = "../src/cjk_commons/_version.py"
pattern = '^__version__\s*=\s*"([^"]+)"'
source = "file"
